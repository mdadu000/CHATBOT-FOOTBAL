<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsBot ⚡ | Gen Z Chat</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- For markdown support -->
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>⚡ SportsBot <span class="badge">LIVE</span></h1>
            <p>Your Gen Z Sports Plug 🔌 Talk to me! 🗣️</p>
        </header>

        <div id="chat-window" class="chat-window">
            <div class="message bot">
                <div class="bubble">Yo fam! 👋 I'm your SportsBot. From the pitch to the court, I got the tea ☕. Ask me anything sports-related! No cap. 🧢🚫</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your Q here... (e.g. Who's the GOAT? 🐐)" autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">Send 🚀</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
